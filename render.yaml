services:
  - type: web
    name: sql-query-agent
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: google_genai
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: RATE_LIMIT_PER_HOUR
        value: "60"
